<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="theme.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Viewer — JK Learn</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column;
           overscroll-behavior: none; }
    header { background: var(--navy); color: #fff; padding: 0.7rem 1rem;
             border-bottom: 3px solid var(--gold); display: flex; align-items: center; gap: 0.8rem; flex-shrink: 0;
             flex-wrap: wrap; }
    header a.home { color: var(--gold); text-decoration: none; font-size: 0.8rem; font-weight: 600; white-space: nowrap; }
    header a.home:hover { text-decoration: underline; }
    #pdf-title { font-size: 0.9rem; font-weight: 600; opacity: 0.9; flex: 1; min-width: 80px;
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .toolbar { display: flex; align-items: center; gap: 0.4rem; flex-shrink: 0; }
    .toolbar button { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25);
                    color: #fff; padding: 0.3rem 0.6rem; border-radius: 5px; cursor: pointer;
                    font-size: 0.85rem; font-family: inherit; line-height: 1; }
    .toolbar button:hover:not(:disabled) { background: rgba(255,255,255,0.22); }
    .toolbar button:disabled { opacity: 0.35; cursor: default; }
    .toolbar span.pageno { font-size: 0.8rem; opacity: 0.9; white-space: nowrap; min-width: 4.5em; text-align: center; }
    .theme-toggle { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25);
                    color: #fff; padding: 0.3rem 0.7rem; border-radius: 5px; cursor: pointer;
                    font-size: 0.8rem; font-family: inherit; flex-shrink: 0; }
    .theme-toggle:hover { background: rgba(255,255,255,0.2); }
    #pdf-container { flex: 1; background: var(--sidebar-bg, #e8e8e4); overflow: auto;
                      display: flex; flex-direction: column; align-items: center; padding: 1.2rem 0.8rem; gap: 0.5rem; }
    #pdf-container iframe { width: 100%; height: 100%; border: none; display: block; }
    #pdf-canvas { background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,0.25); max-width: 100%; }
    .error, .status { padding: 2rem; text-align: center; color: var(--text-muted); }
    .error { color: #c00; }
  </style>
</head>
<body>
<header>
  <a href="/" id="home-link" class="home">← JK Learn</a>
  <span id="pdf-title">Loading…</span>
  <div class="toolbar" id="pdf-toolbar" style="display:none">
    <button id="prev-page" title="Previous page">‹</button>
    <span class="pageno"><span id="page-num">1</span> / <span id="page-count">1</span></span>
    <button id="next-page" title="Next page">›</button>
    <button id="zoom-out" title="Zoom out">−</button>
    <button id="zoom-reset" title="Reset zoom">100%</button>
    <button id="zoom-in" title="Zoom in">+</button>
    <a id="download-link" class="home" style="margin-left:0.3rem" title="Open raw PDF">Download</a>
  </div>
  <button class="theme-toggle" onclick="toggleTheme()"><span id="theme-icon">Dark</span></button>
</header>
<div id="pdf-container">
  <div class="error" id="error-msg" style="display:none">No PDF specified. Add <code>?file=path/to/file.pdf</code></div>
  <div class="status" id="status-msg" style="display:none"></div>
  <canvas id="pdf-canvas" style="display:none"></canvas>
  <iframe id="pdf-frame" title="PDF Viewer" style="display:none"></iframe>
</div>

<script type="module">
import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.4.299/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.4.299/pdf.worker.min.mjs';

function getParam(name) {
  return new URLSearchParams(window.location.search).get(name);
}
function titleFromPath(p) {
  const name = p.split('/').pop().replace(/\.(pdf|pptx|docx|doc|xlsx)$/i, '');
  return name.replace(/[-_]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

const statusEl = document.getElementById('status-msg');
const canvas = document.getElementById('pdf-canvas');
const ctx = canvas.getContext('2d');
let pdfDoc = null, pageNum = 1, zoom = 1, baseScale = 1, rendering = false, pendingPage = null;

function showStatus(msg) {
  statusEl.textContent = msg;
  statusEl.style.display = msg ? '' : 'none';
}

async function renderPage(num) {
  if (rendering) { pendingPage = num; return; }
  rendering = true;
  const page = await pdfDoc.getPage(num);
  const unscaled = page.getViewport({ scale: 1 });
  // Fit page width to the available container on first render of each page size.
  const available = document.getElementById('pdf-container').clientWidth - 32;
  baseScale = Math.min(available / unscaled.width, 1.8);
  const viewport = page.getViewport({ scale: baseScale * zoom });
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  await page.render({ canvasContext: ctx, viewport }).promise;
  rendering = false;
  if (pendingPage !== null) {
    const next = pendingPage;
    pendingPage = null;
    renderPage(next);
  }
  document.getElementById('page-num').textContent = num;
  document.getElementById('prev-page').disabled = num <= 1;
  document.getElementById('next-page').disabled = num >= pdfDoc.numPages;
}

async function loadPdf(fileUrl, title) {
  showStatus('Loading PDF…');
  try {
    pdfDoc = await pdfjsLib.getDocument(fileUrl).promise;
    document.getElementById('page-count').textContent = pdfDoc.numPages;
    document.getElementById('pdf-toolbar').style.display = '';
    canvas.style.display = '';
    showStatus('');
    await renderPage(pageNum);
  } catch (err) {
    showStatus('');
    document.getElementById('error-msg').textContent =
      'Could not load this PDF (' + (err && err.message ? err.message : 'unknown error') + '). ' +
      'Opening the raw file instead.';
    document.getElementById('error-msg').style.display = '';
    const frame = document.getElementById('pdf-frame');
    frame.src = fileUrl;
    frame.style.display = 'block';
  }
}

document.getElementById('prev-page').addEventListener('click', () => {
  if (pageNum > 1) { pageNum--; renderPage(pageNum); }
});
document.getElementById('next-page').addEventListener('click', () => {
  if (pdfDoc && pageNum < pdfDoc.numPages) { pageNum++; renderPage(pageNum); }
});
document.getElementById('zoom-in').addEventListener('click', () => {
  zoom = Math.min(zoom + 0.2, 3);
  document.getElementById('zoom-reset').textContent = Math.round(zoom * 100) + '%';
  renderPage(pageNum);
});
document.getElementById('zoom-out').addEventListener('click', () => {
  zoom = Math.max(zoom - 0.2, 0.4);
  document.getElementById('zoom-reset').textContent = Math.round(zoom * 100) + '%';
  renderPage(pageNum);
});
document.getElementById('zoom-reset').addEventListener('click', () => {
  zoom = 1;
  document.getElementById('zoom-reset').textContent = '100%';
  renderPage(pageNum);
});
window.addEventListener('resize', () => { if (pdfDoc) renderPage(pageNum); });
window.addEventListener('keydown', (e) => {
  if (!pdfDoc) return;
  if (e.key === 'ArrowRight') document.getElementById('next-page').click();
  if (e.key === 'ArrowLeft') document.getElementById('prev-page').click();
});

(function init() {
  const file = getParam('file');
  const back = getParam('back');
  if (!file) { document.getElementById('error-msg').style.display = ''; return; }
  const title = getParam('title') || titleFromPath(file);
  document.title = title + ' — JK Learn';
  document.getElementById('pdf-title').textContent = title;
  if (back) {
    const el = document.getElementById('home-link');
    el.href = back;
    el.textContent = '← Back';
  }
  const fileUrl = new URL(file, window.location.origin).href;
  document.getElementById('download-link').href = fileUrl;
  if (/\.(pptx|docx|doc|xlsx)$/i.test(file)) {
    const isLocal = /^(localhost|127\.0\.0\.1)$/.test(window.location.hostname);
    document.getElementById('pdf-toolbar').style.display = '';
    ['prev-page', 'next-page', 'zoom-out', 'zoom-reset', 'zoom-in'].forEach(id => {
      document.getElementById(id).style.display = 'none';
    });
    if (isLocal) {
      document.getElementById('error-msg').innerHTML =
        'Office documents (.docx/.pptx) can only be previewed once this site is deployed ' +
        '(the viewer has to fetch the file over the public internet, and it can’t reach localhost). ' +
        '<a id="local-download" href="' + fileUrl + '">Download the file</a> to view it now, ' +
        'or open this same link on the deployed site.';
      document.getElementById('error-msg').style.display = '';
    } else {
      const frame = document.getElementById('pdf-frame');
      frame.src = 'https://view.officeapps.live.com/op/embed.aspx?src=' + encodeURIComponent(fileUrl);
      frame.style.display = 'block';
    }
  } else {
    loadPdf(fileUrl, title);
  }
})();
</script>
<script>
function toggleTheme() {
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  document.getElementById('theme-icon').textContent = next === 'dark' ? 'Light' : 'Dark';
}
(function() {
  const saved = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  if (saved === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); document.getElementById('theme-icon').textContent = 'Light'; }
})();
</script>
</body>
</html>
